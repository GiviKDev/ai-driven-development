---
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify plugin versions match tag
        run: |
          tag_version="${{ steps.version.outputs.version }}"
          copilot_version=$(jq -r '.version' plugin/plugin.json)
          claude_version=$(jq -r '.version' plugin/.claude-plugin/plugin.json)

          if [ "$copilot_version" != "$tag_version" ]; then
            echo "ERROR: plugin/plugin.json version ($copilot_version) does not match tag ($tag_version)"
            exit 1
          fi
          if [ "$claude_version" != "$tag_version" ]; then
            echo "ERROR: plugin/.claude-plugin/plugin.json version ($claude_version) does not match tag ($tag_version)"
            exit 1
          fi
          echo "Plugin versions match tag: $tag_version"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
