---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  plugin-validate:
    name: Plugin Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate plugin.json files are valid JSON
        run: |
          jq empty plugins/journey-verification/plugin.json
          jq empty plugins/journey-verification/.claude-plugin/plugin.json

      - name: Check required fields in Copilot manifest
        run: |
          for field in name description version skills agents; do
            value=$(jq -r ".$field" plugins/journey-verification/plugin.json)
            if [ "$value" = "null" ] || [ -z "$value" ]; then
              echo "ERROR: Missing required field '$field' in plugins/journey-verification/plugin.json"
              exit 1
            fi
          done
          echo "Copilot manifest OK"

      - name: Check required fields in Claude Code manifest
        run: |
          for field in name description version; do
            value=$(jq -r ".$field" plugins/journey-verification/.claude-plugin/plugin.json)
            if [ "$value" = "null" ] || [ -z "$value" ]; then
              echo "ERROR: Missing required field '$field' in plugins/journey-verification/.claude-plugin/plugin.json"
              exit 1
            fi
          done
          echo "Claude Code manifest OK"

      - name: Check manifests are in sync
        run: |
          copilot_name=$(jq -r '.name' plugins/journey-verification/plugin.json)
          claude_name=$(jq -r '.name' plugins/journey-verification/.claude-plugin/plugin.json)
          copilot_version=$(jq -r '.version' plugins/journey-verification/plugin.json)
          claude_version=$(jq -r '.version' plugins/journey-verification/.claude-plugin/plugin.json)

          if [ "$copilot_name" != "$claude_name" ]; then
            echo "ERROR: Name mismatch: '$copilot_name' vs '$claude_name'"
            exit 1
          fi
          if [ "$copilot_version" != "$claude_version" ]; then
            echo "ERROR: Version mismatch: '$copilot_version' vs '$claude_version'"
            exit 1
          fi
          echo "Manifests in sync: $copilot_name@$copilot_version"

      - name: Validate SKILL.md frontmatter
        run: |
          failed=0
          for skill in plugins/journey-verification/skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$skill")")
            frontmatter=$(sed -n '/^---$/,/^---$/p' "$skill" | sed '1d;$d')

            for field in name description argument-hint; do
              if ! echo "$frontmatter" | grep -q "^${field}:"; then
                echo "ERROR: $skill missing '$field' in frontmatter"
                failed=1
              fi
            done

            skill_name=$(echo "$frontmatter" | grep '^name:' | sed 's/^name: *//')
            if [ "$skill_name" != "$dir" ]; then
              echo "ERROR: $skill name '$skill_name' does not match directory '$dir'"
              failed=1
            fi
          done
          if [ $failed -eq 1 ]; then exit 1; fi
          echo "All skills valid"

      - name: Validate agent files
        run: |
          if [ ! -d plugins/journey-verification/agents ] || [ -z "$(ls plugins/journey-verification/agents/*.agent.md 2>/dev/null)" ]; then
            echo "ERROR: No agent files found in plugins/journey-verification/agents/"
            exit 1
          fi
          for agent in plugins/journey-verification/agents/*.agent.md; do
            if [ ! -s "$agent" ]; then
              echo "ERROR: $agent is empty"
              exit 1
            fi
          done
          echo "All agents valid"
