---
branches: [main]
tagFormat: v${version}
plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      releaseRules:
        - type: feat
          release: minor
        - type: fix
          release: patch
        - type: perf
          release: patch
        - type: refactor
          release: patch
        - type: revert
          release: patch
        # While 0.x: breaking = minor.
        # When promoting to 1.0.0, change to major.
        - breaking: true
          release: minor
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: perf
            section: Performance
          - type: refactor
            section: Refactoring
          - type: docs
            section: Documentation
            hidden: true
          - type: chore
            section: Maintenance
            hidden: true
          - type: ci
            section: CI/CD
            hidden: true
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  - - "@semantic-release/exec"
    - prepareCmd: >
        jq --arg v "${nextRelease.version}"
        '.version = $v' plugins/journey-verification/plugin.json >
        plugins/journey-verification/plugin.json.tmp &&
        mv plugins/journey-verification/plugin.json.tmp plugins/journey-verification/plugin.json &&
        jq --arg v "${nextRelease.version}"
        '.version = $v' plugins/journey-verification/.claude-plugin/plugin.json >
        plugins/journey-verification/.claude-plugin/plugin.json.tmp &&
        mv plugins/journey-verification/.claude-plugin/plugin.json.tmp
        plugins/journey-verification/.claude-plugin/plugin.json
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - plugins/journey-verification/plugin.json
        - plugins/journey-verification/.claude-plugin/plugin.json
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - "@semantic-release/github"
